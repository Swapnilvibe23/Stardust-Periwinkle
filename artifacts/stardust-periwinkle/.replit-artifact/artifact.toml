kind = "mobile"
previewPath = "/"
title = "Stardust & Periwinkle"
version = "1.0.0"
id = "artifacts/stardust-periwinkle"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 24571

[services.development]
run = "pnpm --filter @workspace/stardust-periwinkle run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/stardust-periwinkle", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/stardust-periwinkle", "run", "serve" ]

[services.env]
PORT = "24571"
BASE_PATH = "/"
